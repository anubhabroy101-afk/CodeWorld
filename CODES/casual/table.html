<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Report</title>
    <style>
        h1 {
            color: red; /* Heading in red color */
        }
        table {
            background-color: yellow; /* Table background in yellow */
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            text-align: center; /* Center aligns text in table */
            padding: 8px;
        }
        th {
            font-weight: bold;
        }
        .center {
            text-align: center; /* Center-align the Sl. No. column */
        }
    </style>
</head>
<body>
    <h1>Progress Report of ROHAN</h1>
    <table>
        <tr>
            <th class="center">Sl. No.</th>
            <th>Subject</th>
            <th>Full Marks</th>
            <th>Pass Marks</th>
            <th>Marks Obtained</th>
        </tr>
        <tr>
            <td class="center">1</td>
            <td>English</td>
            <td>100</td>
            <td>35</td>
            <td>74</td>
        </tr>
        <tr>
            <td class="center">2</td>
            <td>Hindi</td>
            <td>100</td>
            <td>35</td>
            <td>65</td>
        </tr>
        <tr>
            <td class="center">3</td>
            <td>Maths</td>
            <td>100</td>
            <td>40</td>
            <td>84</td>
        </tr>
        <tr>
            <td class="center">4</td>
            <td>S. St.</td>
            <td>100</td>
            <td>40</td>
            <td>75</td>
        </tr>
    </table>
</body>
</html>
